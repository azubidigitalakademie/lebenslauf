<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Das bin ich!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="banner">

<!-- insert your profile picture - best in square (e.g. 1200x1200px) and max. size ~1MB: -->
    <img src="profile.png" alt="Profile picture" class="profile-pic" />

<!-- Type here and only change text: -->
    <h1>Tippe hier deinen Namen</h1>
    <p class="subtitle">Schreibe auf, was dein Motto ist / was dich inspiriert</p>
  </header>

  <main class="content">
    <p class="about-text">
      Hi! Ich bin [Name], [kurze Beschreibung deiner Skills / Interessen]. Hier findest du Links zu meinen wichtigsten Projekten und Infos.
    </p>
    
    <div class="link-buttons">

<!-- Link kommt in das Feld mit dem '#', z.B. "https://azubi.digital" : -->
<!-- Lösche keine Sonderzeichen, füge nur https:// URL/Web-Adresse ein! -->
      <a href="#" class="btn">Download Lebenslauf</a>
      <a href="#" class="btn">Social Media</a>
      <a href="#" class="btn">LinkedIn</a>
      <a href="#" class="btn">Mehr über mich</a>
    </div>
  </main>

  <footer class="footer">
    <img src="MINTful.png" alt="MINTful future" class="partner-logo" />
    <img src="azubi-digital-logo.png" alt="Azubi Digital Akademie" class="partner-logo" />
  </footer>
</body>
</html>
